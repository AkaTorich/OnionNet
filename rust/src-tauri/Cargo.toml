[package]
name = "stalknet-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "StalkNet window (Tauri) — the Rust rewrite of StalkNet.Client."
build = "build.rs"

[[bin]]
name = "stalknet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stalknet-core = { path = "../core" }
