[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["AkaTorich"]
repository = "https://github.com/AkaTorich/StalkNet"

# Every cryptographic primitive is a well-reviewed RustCrypto crate pinned to a
# fixed version.
[workspace.dependencies]
blake2 = "0.10.6"
sha1 = "0.10"
sha2 = "0.10.8"
hmac = "0.12.1"
hkdf = "0.12.4"
aes = "0.8.4"
ctr = "0.9.2"
argon2 = "0.5.3"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
rand_core = "0.6.4"
getrandom = "0.2.15"
subtle = "2.6.1"
zeroize = "1.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
