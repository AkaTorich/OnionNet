[package]
name = "stalknet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "StalkNet core: onion routing, crypto, discovery, hidden services, sharing and swarm."

[lib]
name = "stalknet_core"
path = "src/lib.rs"

[features]
# Windows-only backends, off by default so the build stays cross-platform.
# Enabling one also needs the matching windows-sys features (see sharing/*.rs).
windows_logon = []
windows_shares = []
windows_explorer = []

[dependencies]
blake2.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
aes.workspace = true
argon2.workspace = true
p256.workspace = true
rand_core.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# DPAPI (CryptProtectData/CryptUnprotectData) for identity files sealed by the
# Windows account instead of a passphrase — the same "ONIW" format as the C#.
windows-sys = { version = "0.52.0", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
