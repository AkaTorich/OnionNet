name: Release

# A tag v* builds StalkNet on Windows, Linux and macOS — after the core's tests
# pass on each of them — and puts the builds into that tag's release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Core tests on this system
        run: cargo test --release -p stalknet-core

      - name: Network tests on this system (nodes on one machine, for real)
        run: cargo test --release -p stalknet-core -- --ignored two_nodes_find_each_other network_end_to_end --test-threads=1

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo tauri build --no-bundle
          mkdir -p ../out
          cp target/release/stalknet.exe ../out/StalkNet-${{ matrix.name }}.exe

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo tauri build --bundles appimage,deb
          mkdir -p ../out
          cp target/release/bundle/appimage/*.AppImage ../out/StalkNet-${{ matrix.name }}.AppImage
          cp target/release/bundle/deb/*.deb ../out/StalkNet-${{ matrix.name }}.deb

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo tauri build --target universal-apple-darwin --bundles app,dmg
          mkdir -p ../out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/StalkNet-${{ matrix.name }}.dmg
          (cd target/universal-apple-darwin/release/bundle/macos && ditto -c -k --keepParent StalkNet.app "$GITHUB_WORKSPACE/out/StalkNet-${{ matrix.name }}.app.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: StalkNet-${{ matrix.name }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: StalkNet ${{ github.ref_name }}
          files: out/*
          make_latest: true
